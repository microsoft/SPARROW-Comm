name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 3.15 is a pre-release: its result is reported but does not fail the run.
    continue-on-error: ${{ matrix.python == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra all
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f docker/compose.yml up -d --build --wait
      - run: docker compose -f docker/compose.yml --profile sim run --rm sim
      - if: failure()
        run: docker compose -f docker/compose.yml logs
      - if: always()
        run: docker compose -f docker/compose.yml down -v
