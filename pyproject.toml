[project]
name = "sparrow-comm"
version = "0.1.0"
description = "Receivers for SPARROW field data: device API, Reconyx, IMAP e-mail and FTPS, with pluggable storage hooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zhmiao", email = "zhongqimiao@microsoft.com" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.18",
    "pyjwt>=2.8",
    "cryptography>=42",
]

[project.optional-dependencies]
ftps = ["pyftpdlib>=2.0", "pyopenssl>=24"]
serve = ["uvicorn>=0.30"]
all = ["sparrow-comm[ftps,serve]"]

[project.scripts]
sparrow-comm = "sparrow_comm.cli:main"

[project.urls]
Repository = "https://github.com/microsoft/SPARROW-Comm"

[dependency-groups]
dev = [
    "sparrow-comm[all]",
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
